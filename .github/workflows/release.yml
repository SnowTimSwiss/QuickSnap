name: Release package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach the package to (e.g. v1.0.2)
        required: true
        type: string

permissions:
  contents: write

env:
  UUID: quicksnap@snowtimswiss.github.io

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build extension zip
        run: |
          cd "src/${UUID}"
          zip -r "${GITHUB_WORKSPACE}/${UUID}.shell-extension.zip" \
            extension.js prefs.js metadata.json stylesheet.css schemas/*.xml
          unzip -l "${GITHUB_WORKSPACE}/${UUID}.shell-extension.zip"

      - name: Attach to release
        run: |
          gh release upload "$TAG" "${UUID}.shell-extension.zip" \
            --clobber --repo "$GITHUB_REPOSITORY"
